name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  #v4.2.2

    - name: Set up JDK 17 (Temurin)
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  #v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run tests (mvn clean test)
      run: mvn --batch-mode --no-transfer-progress clean test

    - name: Run PIT mutation testing (mvn pitest:mutationCoverage)
      run: mvn --batch-mode --no-transfer-progress pitest:mutationCoverage

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

    - name: Upload PIT mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pit-report
        path: target/pit-reports/
